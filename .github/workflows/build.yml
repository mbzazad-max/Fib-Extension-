name: Build and deploy BTC & ETH Fib Top Tracker
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run (the Refresh button fills this in)'
        required: false
        default: 'manual'
      force:
        description: 'Rebuild every tab even if no new candle arrived'
        type: boolean
        default: false
  schedule:
    - cron: '25 1 * * *'   # once a day as a safety net (12:25 Sydney summer time); Market-Data commits trigger it too
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'public/index.html', 'public/shim.js', 'public/cloud.js', 'worker/**', 'build/**', 'config/**', 'engine/**', 'tools/**', 'wrangler.jsonc', 'reference/**']
permissions:
  contents: write
concurrency:
  group: fib-extension
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: The page and the engine must be the artifact's own, unchanged
        run: node tools/check_page.js
      - name: Check secrets
        env:
          MD: ${{ secrets.MARKET_DATA_TOKEN }}
        run: '[ -n "$MD" ] || { echo "::error::Secret MARKET_DATA_TOKEN is not set, so the shared data cannot be read. Nothing changed."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: mbzazad-max/market-data
          token: ${{ secrets.MARKET_DATA_TOKEN }}
          path: md
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the engine on closed candles (each tab keeps its last good data on any failure)
        run: python3 build/build.py md ${{ inputs.force && '--force' || '' }}
      - name: Save the new data and forecast logs (one commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/freshness.json state
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Fib tracker build $(python3 -c "import json;print(json.load(open('public/freshness.json'))['generated'])")"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep $((i*2)); done
          echo "::error::Could not save the build."; exit 1
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare secrets not set; built but not deployed."; exit 0; fi
          # a pasted secret can carry a stray space or line break; a real token and account id never contain whitespace
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "Token: ${#CLOUDFLARE_API_TOKEN} characters; account id: ${#CLOUDFLARE_ACCOUNT_ID} characters (expected 32)."
          [ ${#CLOUDFLARE_ACCOUNT_ID} -eq 32 ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID from the Cloudflare dashboard (it has ${#CLOUDFLARE_ACCOUNT_ID}). The built data is saved; the site keeps its last deploy."; exit 1; }
          npx -y wrangler@4 deploy || { echo "::error::Cloudflare refused the deploy. Check the CLOUDFLARE_API_TOKEN secret (only the token value, Workers Scripts: Edit on your account) and CLOUDFLARE_ACCOUNT_ID (32 characters). The built data is saved; the site keeps its last deploy."; exit 1; }   # workers_dev is off: only the home site (dashboards) can reach this Worker
          printf '%s' "$REFRESH_TOKEN" | npx -y wrangler@4 secret put GITHUB_TOKEN
